<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>
        Modbus Master Emulator
    </title>

    <link
        rel="stylesheet"
        href="/style.css">

</head>

<body>

    <h1>
        Modbus Master Emulator
    </h1>

    <div id="connection">
        DISCONNECTED
    </div>

    <h2>
        Controller
    </h2>

    <div id="controller">
    </div>

    <h2>
        Statistics
    </h2>

    <div id="stats">
    </div>

    <h2>
        Zones
    </h2>

    <table id="zones">

        <thead>

            <tr>
                <th>Zone</th>
                <th>Exists</th>
                <th>Status</th>
            </tr>

        </thead>

        <tbody>
        </tbody>

    </table>

    <h2>
        Detectors
    </h2>

    <table id="detectors">

        <thead>

            <tr>
                <th>Address</th>
                <th>Zone</th>
                <th>Type</th>
                <th>Status</th>
                <th>Fault</th>
                <th>Threshold</th>
            </tr>

        </thead>

        <tbody>
        </tbody>

    </table>

    <script src="/socket.io/socket.io.js"></script>

    <script src="/app.js"></script>

</body>

</html>
